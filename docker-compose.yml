# DZD Ad Network — local development stack
# Usage:  docker compose up -d   →  http://localhost:8080
services:
  app:
    build: ./docker
    container_name: dzd-adserver-app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Live-mounted so you can edit the code in VS Code and just refresh
      - ./revive:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    container_name: dzd-adserver-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: dzd_adserver
      MARIADB_USER: dzd
      MARIADB_PASSWORD: dzd_pass_2026
      MARIADB_ROOT_PASSWORD: dzd_root_2026
    volumes:
      - dzd_dbdata:/var/lib/mysql

  # Public website (Laravel) — http://localhost:8081
  portal:
    build:
      context: ./docker
      dockerfile: Dockerfile.portal
    container_name: dzd-portal
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./portal:/var/www/html

volumes:
  dzd_dbdata:
